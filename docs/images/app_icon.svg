<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Android Compose Deep Space -->
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1C29" />
      <stop offset="100%" stop-color="#0E0F15" />
    </linearGradient>

    <!-- Calendar Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#282C40" />
      <stop offset="100%" stop-color="#181A26" />
    </linearGradient>

    <!-- Jetpack Compose Accent Header Gradient -->
    <linearGradient id="composeAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4" />
      <stop offset="50%" stop-color="#7B1FA2" />
      <stop offset="100%" stop-color="#00C853" />
    </linearGradient>

    <!-- Selection Highlight Gradient -->
    <linearGradient id="highlightPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8AB4F8" />
      <stop offset="100%" stop-color="#C58AF9" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Squircle / App Icon Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#iconBg)" />
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="url(#composeAccent)" stroke-width="3" stroke-opacity="0.35" />

  <!-- Calendar Graphic Element -->
  <g transform="translate(68, 68)" filter="url(#shadow)">
    <!-- Base Calendar Sheet -->
    <rect x="0" y="0" width="376" height="376" rx="64" fill="url(#cardGrad)" stroke="#3D4468" stroke-width="4" />

    <!-- Calendar Top Bar -->
    <path d="M 0 64 A 64 64 0 0 1 64 0 L 312 0 A 64 64 0 0 1 376 64 L 376 104 L 0 104 Z" fill="url(#composeAccent)" />

    <!-- Binder Rings -->
    <rect x="88" y="-12" width="24" height="40" rx="12" fill="#E8EAED" />
    <rect x="264" y="-12" width="24" height="40" rx="12" fill="#E8EAED" />

    <!-- Row 1: Day Dots -->
    <circle cx="76" cy="164" r="20" fill="#3D4468" />
    <circle cx="151" cy="164" r="20" fill="#3D4468" />
    <circle cx="225" cy="164" r="20" fill="#8AB4F8" />
    <circle cx="300" cy="164" r="20" fill="#3D4468" />

    <!-- Row 2: Selected Range Pill (Selection Engine) -->
    <rect x="52" y="218" width="198" height="58" rx="29" fill="url(#highlightPill)" />
    <circle cx="81" cy="247" r="20" fill="#1C1E2D" />
    <circle cx="151" cy="247" r="16" fill="#FFFFFF" fill-opacity="0.85" />
    <circle cx="221" cy="247" r="20" fill="#1C1E2D" />
    <circle cx="300" cy="247" r="20" fill="#3D4468" />

    <!-- Row 3: Multi-Calendar Representation (Hijri Green & Solar Sun Accent) -->
    <circle cx="76" cy="318" r="20" fill="#3D4468" />
    <circle cx="151" cy="318" r="20" fill="#81C995" />
    <circle cx="225" cy="318" r="20" fill="#FBBF24" />
    <circle cx="300" cy="318" r="20" fill="#3D4468" />
  </g>
</svg>
