name: Publish approved 2.1.0 release

on:
  push:
    branches: [update]

concurrency:
  group: publish-approved-2-1-0
  cancel-in-progress: false

permissions:
  contents: write
  checks: read
  actions: read

jobs:
  release:
    if: >-
      github.repository == 'mortezasun/android-calendarview' &&
      contains(github.event.head_commit.message, 'release: 2.1.0')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: mortezasun/android-calendarview
      REQUIRED_CHECKS: '["assemble","unit-tests","lint","publishing","Core and sample instrumentation"]'
    steps:
      - name: Check out release automation
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Refuse to overwrite an existing release tag
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$GH_REPO/git/ref/tags/2.1.0" >/dev/null 2>&1; then
            echo "Tag 2.1.0 already exists; refusing to move it." >&2
            exit 1
          fi

      - name: Verify release commit has the same tree as its parent
        shell: bash
        run: |
          set -euo pipefail
          current_tree=$(gh api "repos/$GH_REPO/git/commits/$GITHUB_SHA" --jq '.tree.sha')
          parent_sha=$(gh api "repos/$GH_REPO/git/commits/$GITHUB_SHA" --jq '.parents[0].sha')
          parent_tree=$(gh api "repos/$GH_REPO/git/commits/$parent_sha" --jq '.tree.sha')
          if [ "$current_tree" != "$parent_tree" ]; then
            echo "Release commit tree differs from its parent; refusing to release." >&2
            exit 1
          fi
          echo "PARENT_SHA=$parent_sha" >> "$GITHUB_ENV"

      - name: Wait for the first complete API 29 instrumentation run
        shell: bash
        run: |
          set -euo pipefail
          source scripts/wait-for-required-checks.sh
          wait_for_checks "$PARENT_SHA" '["Core and sample instrumentation"]'

      - name: Wait for all checks on the release commit
        shell: bash
        run: |
          set -euo pipefail
          source scripts/wait-for-required-checks.sh
          wait_for_checks "$GITHUB_SHA" "$REQUIRED_CHECKS"

      - name: Create approved tag and public release
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<NOTES
          Native Jetpack Compose calendar library release with a binary-compatible 2.0.1 bridge.

          ### Added
          - Calendar-month, week, agenda, marker, range-policy, adaptive-month and style APIs.
          - A version-aligned \`calendar-bom\` publication.
          - Pluggable Hijri date providers and saveable provider-aware Hijri month state.
          - A dependency-free public JVM API guard and independent consumer coverage.

          ### Compatibility
          - All 248 public/protected JVM members from the published 2.0.1 AARs retain identical descriptors.
          - Hidden delegation overloads preserve the previous selection, month-grid and engine-month signatures.
          - New source resolves the current APIs; no deliberate breaking change.

          ### Verification
          - Two complete API 29 instrumentation runs on the identical release tree: ${PARENT_SHA} and ${GITHUB_SHA}.
          - JVM tests, lint, publishing verification and public API guard passed on both release-tree commits.
          - JitPack tag-build and remote consumer verification are the remaining post-release checks.

          ### Intended JitPack coordinates
          - com.github.mortezasun.android-calendarview:library:2.1.0
          - com.github.mortezasun.android-calendarview:calendar-gregorian:2.1.0
          - com.github.mortezasun.android-calendarview:calendar-hijri:2.1.0
          - com.github.mortezasun.android-calendarview:calendar-solarHijri:2.1.0
          - com.github.mortezasun.android-calendarview:calendar-bom:2.1.0

          The 2.0.1 tag remains unchanged. Each calendar engine includes the shared core transitively.
          NOTES
          gh release create 2.1.0 --repo "$GH_REPO" --target "$GITHUB_SHA" --title "2.1.0 - Compose calendar release" --notes-file release-notes.md --latest
