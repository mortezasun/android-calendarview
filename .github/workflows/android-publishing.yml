name: Android publishing verification

on:
  push:
    branches: [master, update]
  pull_request:
    branches: [master, update]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-publishing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publishing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install documented Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Publish all library modules and the BOM to an isolated Maven repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-diagnostics
          git rev-parse HEAD | tee .ci-diagnostics/publishing-sha.txt
          bash ./gradlew :library:publishToMavenLocal :calendar-gregorian:publishToMavenLocal :calendar-hijri:publishToMavenLocal :calendar-solarHijri:publishToMavenLocal :calendar-solarHijri-native:publishToMavenLocal :calendar-chinese-native:publishToMavenLocal :calendar-chinese-compose:publishToMavenLocal :calendar-bom:publishToMavenLocal \
            -Dmaven.repo.local="$RUNNER_TEMP/calendar-maven" \
            --no-daemon --stacktrace --console=plain 2>&1 | tee .ci-diagnostics/publishing.txt

      - name: Verify generated artifacts and preserve publication metadata
        shell: bash
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/calendar-maven/com/github/mortezasun/android-calendarview"
          mkdir -p .ci-diagnostics/publications
          for module in library calendar-gregorian calendar-hijri calendar-solarHijri calendar-solarHijri-native calendar-chinese-compose; do
            directory="$base/$module"
            for suffix in .aar .pom .module -sources.jar; do
              file=$(find "$directory" -type f -name "${module}-*${suffix}" -size +0c -print -quit)
              if [ -z "$file" ]; then
                echo "Missing nonempty publication: $module $suffix" >&2
                exit 1
              fi
              echo "Verified $file"
            done
            cp -R "$directory" .ci-diagnostics/publications/
          done
          native_pom=$(find "$base/calendar-solarHijri-native" -type f -name 'calendar-solarHijri-native-*.pom' -print -quit)
          if grep -q 'jalalicalendar' "$native_pom"; then
            echo "calendar-solarHijri-native POM must not depend on jalalicalendar" >&2
            exit 1
          fi
          engine_base="$base/calendar-chinese-native"
          for suffix in .pom .module -sources.jar; do
            file=$(find "$engine_base" -maxdepth 1 -type f -name "calendar-chinese-native-*${suffix}" -size +0c -print -quit)
            if [ -z "$file" ]; then
              echo "Missing nonempty publication: calendar-chinese-native $suffix" >&2
              exit 1
            fi
            echo "Verified $file"
          done
          engine_jar=$(find "$engine_base" -type f -name 'calendar-chinese-native-*.jar' ! -name '*-sources.jar' -size +0c -print -quit)
          if [ -z "$engine_jar" ]; then
            echo "Missing calendar-chinese-native metadata jar" >&2
            exit 1
          fi
          engine_pom=$(find "$engine_base" -maxdepth 1 -type f -name 'calendar-chinese-native-*.pom' -print -quit)
          if grep -qE 'calendar-(gregorian|hijri|solarHijri)|androidx|compose' "$engine_pom"; then
            echo "calendar-chinese-native POM must stay free of other engines, AndroidX and Compose" >&2
            exit 1
          fi
          for variant in calendar-chinese-native-jvm calendar-chinese-native-linuxx64; do
            variant_base="$base/$variant"
            for suffix in .pom .module -sources.jar; do
              file=$(find "$variant_base" -maxdepth 1 -type f -name "$variant-*${suffix}" -size +0c -print -quit)
              if [ -z "$file" ]; then
                echo "Missing nonempty publication: $variant $suffix" >&2
                exit 1
              fi
              echo "Verified $file"
            done
            cp -R "$variant_base" .ci-diagnostics/publications/
          done
          cp -R "$engine_base" .ci-diagnostics/publications/
          bom_base="$base/calendar-bom"
          for suffix in .pom .module; do
            file=$(find "$bom_base" -type f -name "calendar-bom-*${suffix}" -size +0c -print -quit)
            if [ -z "$file" ]; then
              echo "Missing nonempty BOM publication: calendar-bom $suffix" >&2
              exit 1
            fi
            echo "Verified $file"
          done
          cp -R "$bom_base" .ci-diagnostics/publications/

      - name: Upload publishing diagnostics and artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-publishing-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: .ci-diagnostics/**
