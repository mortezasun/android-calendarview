name: Android publishing verification

on:
  push:
    branches: [master, update]
  pull_request:
    branches: [master, update]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-publishing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publishing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install documented Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Publish all library modules and the BOM to an isolated Maven repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-diagnostics
          git rev-parse HEAD | tee .ci-diagnostics/publishing-sha.txt
          bash ./gradlew :library:publishToMavenLocal :calendar-gregorian:publishToMavenLocal :calendar-hijri:publishToMavenLocal :calendar-solarHijri:publishToMavenLocal :calendar-solarHijri-native:publishToMavenLocal :calendar-chinese-native:publishToMavenLocal :calendar-chinese-compose:publishToMavenLocal :calendar-bom:publishToMavenLocal \
            -Dmaven.repo.local="$RUNNER_TEMP/calendar-maven" \
            --no-daemon --stacktrace --console=plain 2>&1 | tee .ci-diagnostics/publishing.txt

      - name: Verify generated artifacts and preserve publication metadata
        shell: bash
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/calendar-maven/com/github/mortezasun/android-calendarview"
          VERSION="$(sed -nE 's/^[[:space:]]*version = "([^"]+)"$/\1/p' build.gradle.kts | head -n 1)"
          if [[ -z "$VERSION" ]]; then
            echo "Could not read the publication version from build.gradle.kts" >&2
            exit 1
          fi
          bash scripts/verify-publication.sh "$RUNNER_TEMP/calendar-maven" "$VERSION" \
            2>&1 | tee .ci-diagnostics/publication-verification.txt
          native_pom="$base/calendar-solarHijri-native/$VERSION/calendar-solarHijri-native-$VERSION.pom"
          if grep -q 'jalalicalendar' "$native_pom"; then
            echo "calendar-solarHijri-native POM must not depend on jalalicalendar" >&2
            exit 1
          fi
          mkdir -p .ci-diagnostics/publications
          cp -R "$base" .ci-diagnostics/publications/

      - name: Build isolated published-artifact consumers
        shell: bash
        run: |
          set -euo pipefail
          bash ./gradlew -p tools/consumer-check \
            :jvm-consumer:run :android-consumer:compileDebugKotlin \
            -PconsumerRepo="$RUNNER_TEMP/calendar-maven" \
            --no-daemon --stacktrace --console=plain \
            2>&1 | tee .ci-diagnostics/consumer-check.txt

      - name: Upload publishing diagnostics and artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-publishing-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: .ci-diagnostics/**
