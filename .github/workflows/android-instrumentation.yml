name: Android instrumentation

on:
  push:
    branches: [master, update]
  pull_request:
    branches: [master, update]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-instrumentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-instrumentation:
    name: Core and sample instrumentation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install documented compile SDK and build tools
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Compile core and sample instrumentation APKs
        run: bash ./gradlew :library:assembleDebugAndroidTest :calendarviewsample:assembleDebugAndroidTest --no-daemon --stacktrace --console=plain

      - name: Prepare and verify KVM access
        run: bash scripts/prepare-kvm.sh

      - name: Run all core and sample instrumented tests on API 29
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          script: bash scripts/run-connected-tests.sh

      - name: Upload available instrumentation reports and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-instrumentation-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            .ci-diagnostics/*.txt
            library/build/reports/androidTests/**
            library/build/outputs/androidTest-results/**
            library/build/outputs/apk/androidTest/debug/*.apk
            calendarviewsample/build/reports/androidTests/**
            calendarviewsample/build/outputs/androidTest-results/**
            calendarviewsample/build/outputs/apk/androidTest/debug/*.apk

      - name: Report failed instrumented tests
        if: failure()
        run: python3 scripts/report-instrumented-failures.py
