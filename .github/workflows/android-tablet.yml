name: Android tablet verification

on:
  push:
    branches: [update]
  pull_request:
    branches: [master, update]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-tablet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tablet:
    name: Core and sample tablet instrumentation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Record exact verification revision
        run: |
          echo "Verified checkout: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Tablet configuration: API 29, 1600x2560 pixels, 240 dpi, portrait" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install compile SDK and build tools
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Build sample and instrumentation APKs and run JVM tests and lint
        run: bash ./gradlew :calendarviewsample:assembleDebug :library:assembleDebugAndroidTest :calendarviewsample:assembleDebugAndroidTest test :library:lintDebug :calendarviewsample:lintDebug --no-daemon --stacktrace --console=plain

      - name: Prepare and verify KVM access
        run: bash scripts/prepare-kvm.sh

      - name: Run complete core and sample suites in a tablet window
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          script: |
            adb shell wm size 1600x2560
            adb shell wm density 240
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 0
            mkdir -p .ci-diagnostics
            adb shell wm size > .ci-diagnostics/tablet-size.txt
            adb shell wm density > .ci-diagnostics/tablet-density.txt
            bash scripts/run-connected-tests.sh

      - name: Summarize available instrumented test reports
        if: always()
        run: python3 scripts/summarize-instrumented-tests.py

      - name: Upload tablet reports and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-tablet-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            .ci-diagnostics/**
            library/build/reports/**
            library/build/outputs/androidTest-results/**
            calendarviewsample/build/reports/**
            calendarviewsample/build/outputs/androidTest-results/**
            calendar-gregorian/build/reports/tests/**
            calendar-hijri/build/reports/tests/**
            calendar-solarHijri/build/reports/tests/**
            calendar-solarHijri-native/build/reports/tests/**
