name: Android verification

on:
  push:
    branches: [master, update]
  pull_request:
    branches: [master, update]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: assemble
            tasks: ':calendarviewsample:assembleDebug :library:assembleRelease :calendar-gregorian:assembleRelease :calendar-hijri:assembleRelease :calendar-solarHijri:assembleRelease :calendar-solarHijri-native:assembleRelease :calendar-chinese-compose:assembleRelease :calendar-chinese-native:jvmJar :calendar-bom:generatePomFileForCalendarBomPublication'
          - check: unit-tests
            tasks: 'test :calendar-chinese-native:jvmTest'
          - check: native-engine
            tasks: ':calendar-chinese-native:linuxX64Test'
          - check: lint
            tasks: ':library:lintDebug :calendar-gregorian:lintDebug :calendar-hijri:lintDebug :calendar-solarHijri:lintDebug :calendar-solarHijri-native:lintDebug :calendar-chinese-compose:lintDebug :calendarviewsample:lintDebug'
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install documented Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Record toolchain diagnostics
        shell: bash
        run: |
          mkdir -p .ci-diagnostics
          { java -version; bash ./gradlew --version; sdkmanager --list_installed; } 2>&1 | tee .ci-diagnostics/toolchain.txt

      - name: Run ${{ matrix.check }}
        run: bash ./gradlew ${{ matrix.tasks }} --no-daemon --stacktrace --console=plain

      - name: Test instrumentation failure reporter
        if: matrix.check == 'unit-tests'
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Check the public API surface
        if: matrix.check == 'assemble'
        run: bash scripts/api-check.sh

      - name: Upload reports and available APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ matrix.check }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            .ci-diagnostics/toolchain.txt
            **/build/reports/**
            **/build/test-results/**
            calendarviewsample/build/outputs/apk/debug/*.apk
            **/build/outputs/aar/*.aar
